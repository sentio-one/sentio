# One company's Hermes gateway, for Dokploy (Compose, source: Git, compose path deploy/dokploy/docker-compose.yml).
# One Dokploy compose project per company: same repo and branch, different Environment values. Setup: README.md.
#
# No `ports:` and no TLS here: Dokploy's Domains tab points Traefik at service `hermes`, container port 9119, and the
# Cloudflare Tunnel terminates TLS in front of Traefik. The dashboard binds 0.0.0.0 inside the container, which makes
# its auth gate mandatory (it refuses to start without a sign-in provider), so there is no unauthenticated path.
services:
  hermes:
    # Built by Dokploy from this repository on each deploy. The context is the repository root.
    build:
      context: ../..
      dockerfile: Dockerfile
    image: hermes-agent:${COMPANY_SLUG:-gateway}
    restart: unless-stopped
    command: ["gateway", "run"]
    # Agent terminals run in containers on this company's own Docker daemon (the `dockerd` service), never on
    # the host's: the host's docker.sock is not mounted here, so nothing in this container can reach another
    # company's. The daemon is reached over a unix socket on a volume only these two services share.
    depends_on:
      dockerd:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///var/run/dind/docker.sock
      HERMES_UID: "10000"
      HERMES_GID: "10000"

      # Runs the web gateway (dashboard + desktop API) next to `gateway run`, supervised by the image's s6.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      # The address users reach (through the tunnel): OAuth redirects and hermes://connect invite links use it.
      HERMES_DASHBOARD_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://acme.gw.example.com}

      # The company's OIDC provider: Google (https://accounts.google.com) or any IdP. Group grants need a `groups` claim in the
      # ID token; Google has none, so its admins come from ADMIN_EMAILS and its users from invites.
      HERMES_DASHBOARD_OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      HERMES_DASHBOARD_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      HERMES_DASHBOARD_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}

      # Pinned access policy: managed/config.yaml reads these. Admins are the comma-separated emails the IdP verified, plus the
      # members of ADMIN_GROUP when the IdP emits groups.
      HERMES_MANAGED_DIR: /etc/hermes
      HERMES_ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS, e.g. you@yourcompany.example (comma separated)}
      HERMES_ADMIN_GROUP: ${ADMIN_GROUP:-}

      # Model provider keys for this company's agents (add the ones in use in Dokploy's Environment tab).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
    volumes:
      # Profiles, sessions, the grant store: everything this company owns. BACK THIS VOLUME UP.
      - hermes-data:/opt/data
      - ./managed:/etc/hermes:ro
      - ./healthcheck.py:/opt/healthcheck.py:ro
      - dockerd-sock:/var/run/dind
    expose:
      - "9119"
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python", "/opt/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot builds caches and discovers plugins; do not mark it unhealthy while it settles.
      start_period: 180s

  # This company's private Docker daemon: the sandbox for every profile that uses the docker terminal backend.
  # Privileged because Docker-in-Docker needs it, so whoever can talk to its API owns the Dokploy host. It therefore
  # listens on NO network port, only on a unix socket in a volume shared with `hermes`: a sandboxed container runs on
  # this daemon's own bridge and can reach any TCP port it serves (verified: it answered /version at the bridge
  # gateway), but it cannot reach a socket file it was never given. The command starts with `dockerd` on purpose: the
  # image's entrypoint adds a tcp listener only when the first argument is a flag. `--group` is the gateway user's
  # gid (HERMES_GID above) so the socket is usable by `hermes` and by nothing else. This service holds no company
  # data or secrets and has no domain.
  dockerd:
    image: docker:27.5.1-dind
    restart: unless-stopped
    privileged: true
    entrypoint: ["/bin/sh", "/opt/dockerd-entrypoint.sh"]
    command: ["dockerd", "--host=unix:///var/run/dind/docker.sock", "--group=10000"]
    volumes:
      - dockerd-data:/var/lib/docker
      - dockerd-sock:/var/run/dind
      - ./dockerd-entrypoint.sh:/opt/dockerd-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/dind/firewall.ready && docker -H unix:///var/run/dind/docker.sock info >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  hermes-data:
  dockerd-data:
  dockerd-sock:
