name: Release Light Desktop

# Builds the remote-only Sentio One desktop client (SentioOne-*.exe NSIS installer, unsigned) on a GitHub-hosted Windows runner.
#   push to main      -> build; the installer is kept as a workflow artifact for 30 days and also replaces the rolling
#                        `main-latest` pre-release, the one place to find (and be told about) the newest build
#   push of a v* tag  -> build, then publish the installer as a GitHub release
#   manual run        -> build; the artifact is kept
# The build job is read-only: it runs a lot of dependency code on every merge. Only the publish job, which runs for tags
# alone, holds a write token. A tag is created by .github/workflows/tag-release.yml when a merge bumps the version
# (docs/private-fork/RELEASING.md); pushing one by hand works too.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer merge supersedes a build still running for the same ref; a tag build is never cancelled.
concurrency:
  group: light-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build Light exe
    # The package cannot be cross-built: the HUD helper is compiled by Windows' in-box .NET compiler, so this must run on
    # Windows. GitHub-hosted Windows is free for a public repository; the self-hosted VM in WINDOWS-RUNNER.md is not in use.
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      HERMES_DESKTOP_VARIANT: light
      # There is no signing identity, and the build must not go looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Name the artifact after the commit
        id: artifact
        shell: bash
        run: echo "name=hermes-light-desktop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # No --ignore-scripts: the build needs Electron's binary and the native postinstalls (node-pty) for this host.
        run: npm ci --no-audit --no-fund

      - name: Build the installer
        working-directory: apps/desktop
        run: npm run dist:win

      - name: Verify build outputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'apps/desktop/release'
          $exe = Get-ChildItem $out -Filter 'SentioOne-*.exe' | Select-Object -First 1
          if (-not $exe) { throw "No SentioOne-*.exe found in $out" }
          if (Test-Path "$out/win-unpacked/resources/agent-payload") {
            throw 'Light build contains an unexpected agent-payload'
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host "Successfully built $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB), SHA256: $hash"
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "$out/$($exe.Name).sha256"

      - name: Upload run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            apps/desktop/release/SentioOne-*.exe
            apps/desktop/release/SentioOne-*.exe.sha256
          retention-days: 30

  # Every merge to main refreshes ONE rolling pre-release (scripts/fork/refresh-main-release.sh). Like publish below it needs
  # no checkout and is the only other job with a write token; the read-only build job never has one.
  publish-main:
    name: Refresh the rolling main pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the release script
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/fork

      - name: Download the built installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apps/desktop/release

      - name: Replace the main-latest pre-release
        run: scripts/fork/refresh-main-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # A release exists only for a pushed `v*` tag. The installer comes from the build job's artifact, so this job needs no checkout.
  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the built installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apps/desktop/release

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          echo "Publishing release for tag: $TAG_NAME"

          RELEASE_NOTES="### Sentio One Light Desktop Client ($TAG_NAME)

          Remote-only desktop client for Sentio One and Hermes Agent gateways.

          - **No local agent runtime**: Lightweight client connecting directly to remote gateways.
          - **Seamless onboarding**: First run opens remote gateway configuration.
          - **Deep-linking support**: Supports \`sentio://connect?url=&invite=\` links and existing \`hermes://\` links with confirmation dialogs.

          #### Installation
          Download and run \`SentioOne-*.exe\`. The installer is unsigned, so Windows SmartScreen will warn first: choose
          **More info** then **Run anyway**."

          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME exists, uploading assets..."
            gh release upload "$TAG_NAME" apps/desktop/release/SentioOne-*.exe apps/desktop/release/SentioOne-*.exe.sha256 --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              apps/desktop/release/SentioOne-*.exe \
              apps/desktop/release/SentioOne-*.exe.sha256 \
              --title "Sentio One Light Desktop $TAG_NAME" \
              --notes "$RELEASE_NOTES" \
              --draft=false \
              --prerelease=false
          fi
