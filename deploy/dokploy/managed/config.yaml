# Pinned, per-company access policy. Mounted read-only at /etc/hermes/config.yaml inside the container and
# applied ON TOP of the profile's own config.yaml (managed scope: hermes_cli/managed_scope.py), so neither a
# granted user nor an agent editing /opt/data/config.yaml can change who is an admin or which groups map to
# profiles. ${VAR} refs resolve against the container environment, which Dokploy fills per company.
#
# Every key of `access:` is pinned on purpose: a key left out here would stay editable by the profile.
# Per-user grants come from the IdP's `groups` claim and from invites (stored in access_grants.db), not from here.
access:
  admin_groups:
    - "${HERMES_ADMIN_GROUP}"
  # Admins named by an email the IdP verified, comma separated (Google emits no groups claim; FORK_DECISIONS D14).
  admin_emails:
    - "${HERMES_ADMIN_EMAILS}"
  profile_group_prefix: "hermes-profile-"
  group_providers:
    - self_hosted
  admins: []
  users: []

# Sandbox hardening for the docker terminal backend (the company's own `dockerd`, see docker-compose.yml): no
# working-directory mount, no extra volumes, no raw `docker run` flags (--privileged, --pid=host, ...), no
# forwarded host env vars, pinned image, ephemeral tmpfs (/workspace and /root inside the isolated dind), and
# bounded CPU/memory/disk.
# For routed profiles under this access policy, tools/terminal_scope_sandbox.py enforces `TERMINAL_ENV=docker`
# and these pins in `build_profile_terminal_scope` even against a profile's own config.yaml and .env, while
# leaving `backend` unpinned here so the launch profile stays host-level (FORK_DECISIONS.md D13).
terminal:
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_mount_cwd_to_workspace: false
  docker_volumes: []
  docker_extra_args: []
  docker_forward_env: []
  docker_env: {}
  container_persistent: false
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
