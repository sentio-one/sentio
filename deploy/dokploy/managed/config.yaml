# Pinned, per-company access policy. Mounted read-only at /etc/hermes/config.yaml inside the container and
# applied ON TOP of the profile's own config.yaml (managed scope: hermes_cli/managed_scope.py), so neither a
# granted user nor an agent editing /opt/data/config.yaml can change who is an admin or which groups map to
# profiles. ${VAR} refs resolve against the container environment, which Dokploy fills per company.
#
# Every key of `access:` is pinned on purpose: a key left out here would stay editable by the profile.
# Per-user grants come from the IdP's `groups` claim and from invites (stored in access_grants.db), not from here.
access:
  admin_groups:
    - "${HERMES_ADMIN_GROUP}"
  profile_group_prefix: "hermes-profile-"
  group_providers:
    - self_hosted
  admins: []
  users: []

# Intended sandbox hardening for the docker terminal backend (the company's own `dockerd`, see docker-compose.yml): no
# working-directory mount, no extra volumes, no raw `docker run` flags (--privileged, --pid=host, ...).
# NOT YET EFFECTIVE for a routed profile's terminal: tools/terminal_scope.build_profile_terminal_scope reads each profile's
# own config.yaml and .env raw and ignores this overlay (verified 2026-10-23; docs/private-fork/SANDBOX_PLAN.md, phase 1).
# These keys only apply where the config is loaded through load_config. Do not rely on them as a security boundary.
terminal:
  docker_mount_cwd_to_workspace: false
  docker_volumes: []
  docker_extra_args: []
