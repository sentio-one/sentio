name: Release Light Desktop

# Builds the remote-only Light desktop client (HermesLight-*.msix, unsigned).
#   push to main      -> build; the installer is kept as a workflow artifact for 30 days (no release)
#   push of a v* tag  -> build, then publish the installer as a GitHub release
#   manual run        -> build; the artifact is kept
# The build job is read-only: it runs a lot of dependency code on every merge. Only the publish job, which runs for tags
# alone, holds a write token. A tag is created by .github/workflows/tag-release.yml when a merge bumps the version
# (docs/private-fork/RELEASING.md); pushing one by hand works too.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer merge supersedes a build still running for the same ref; a tag build is never cancelled.
concurrency:
  group: light-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build Light MSIX
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Name the artifact after the commit
        id: artifact
        shell: bash
        run: echo "name=hermes-light-desktop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Preflight checks
        shell: powershell
        run: |
          git --version
          python --version
          $free = (Get-PSDrive -Name (Get-Location).Drive.Name).Free / 1GB
          Write-Host "Free disk space: $([math]::Round($free, 1)) GB"
          if ($free -lt 15) { throw "Need at least 15 GB free on build drive" }

      - name: Build Light Desktop (MSIX)
        shell: powershell
        env:
          HERMES_BUILD_CACHE: 'C:\hermes-build-cache'
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = git rev-parse HEAD
          Write-Host "Building Light desktop client at commit: $commit"
          New-Item -ItemType Directory -Force -Path $env:HERMES_BUILD_CACHE | Out-Null
          python scripts/bundles/desktop.py --commit $commit --variant light --clean --cache $env:HERMES_BUILD_CACHE
          if ($LASTEXITCODE -ne 0) { throw "desktop.py failed with exit code $LASTEXITCODE" }

      - name: Verify build outputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'apps/desktop/release'
          $msix = Get-ChildItem $out -Filter 'HermesLight-*.msix' | Select-Object -First 1
          if (-not $msix) { throw "No HermesLight-*.msix found in $out" }
          if (Test-Path "$out/win-unpacked/resources/agent-payload") {
            throw 'Light build contains an unexpected agent-payload'
          }
          $hash = (Get-FileHash $msix.FullName -Algorithm SHA256).Hash
          Write-Host "Successfully built $($msix.Name) ($([math]::Round($msix.Length / 1MB, 1)) MB), SHA256: $hash"
          "$hash  $($msix.Name)" | Set-Content -Encoding ascii "$out/$($msix.Name).sha256"

      - name: Upload run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            apps/desktop/release/HermesLight-*.msix
            apps/desktop/release/HermesLight-*.msix.sha256
            apps/desktop/release/builder-debug.yml
          retention-days: 30

  # A release exists only for a pushed `v*` tag. The installer comes from the build job's artifact, so this job needs no checkout.
  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the built installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apps/desktop/release

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          echo "Publishing release for tag: $TAG_NAME"

          RELEASE_NOTES="### Sentio One Light Desktop Client ($TAG_NAME)

          Remote-only desktop client for Sentio One and Hermes Agent gateways.

          - **No local agent runtime**: Lightweight client connecting directly to remote gateways.
          - **Seamless onboarding**: First run opens remote gateway configuration.
          - **Deep-linking support**: Supports \`hermes://connect?url=&invite=\` links with confirmation dialogs.

          #### Installation
          Download and install \`HermesLight-*.msix\`. Note: As an unsigned MSIX for internal/testing distributions, enable Windows Developer Mode (\`Settings > System > For developers > Developer Mode\`) or install via PowerShell:
          \`\`\`powershell
          Add-AppxPackage -Path .\\HermesLight-*.msix -AllowUnsigned
          \`\`\`"

          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME exists, uploading assets..."
            gh release upload "$TAG_NAME" apps/desktop/release/HermesLight-*.msix apps/desktop/release/HermesLight-*.msix.sha256 --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              apps/desktop/release/HermesLight-*.msix \
              apps/desktop/release/HermesLight-*.msix.sha256 \
              --title "Sentio One Light Desktop $TAG_NAME" \
              --notes "$RELEASE_NOTES" \
              --draft=false \
              --prerelease=false
          fi
